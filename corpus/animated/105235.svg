<title id="s105235-title">The Gardener Who Grew Another Morning</title><desc id="s105235-desc">Native path drawing of an elderly gentle undead gardener kneeling beside a sapling. The hand grips the jug; the knees, boots and pot meet the ground. Water is the single bright accent.</desc>
