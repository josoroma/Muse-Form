<title id="s105233-title">A Lantern for the Marsh</title><desc id="s105233-desc">Native line drawing of a heavy resting dragon holding a lantern ring in one claw. Sparse body planes and wing bones explain the anatomy; the flame is the single bright mark.</desc>
